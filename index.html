<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whenly</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    :root {
      --primary: #2D5BFF;
      --secondary: #FFB800;
      --bg: #FFFFFF;
      --bg-sub: #F5F7FA;
      --text-title: #111111;
      --text-body: #444444;
      --text-sub: #888888;
      --error: #E53935;
      --success: #2E7D32;
      --line: #E3E7ED;
      --ease: cubic-bezier(.2, .8, .2, 1);
      --pin: 56px;
      --nav: 96px;
      --top: 64px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--bg-sub); color: var(--text-body);
      font-family: Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", "Yu Gothic", sans-serif;
      font-size: 16px; line-height: 1.5; word-break: keep-all;
    }
    h1 { margin: 0; font-size: 32px; font-weight: 700; color: var(--text-title); line-height: 1.25; }
    h2 { margin: 0; font-size: 24px; font-weight: 700; color: var(--text-title); line-height: 1.3; }
    h3 { margin: 0; font-size: 20px; font-weight: 600; color: var(--text-title); }
    p { margin: 0; }
    .caption { font-size: 13px; color: var(--text-sub); }
    .card { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.04); min-width: 0; }
    .card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 16px; }
    .stack { display: grid; gap: 24px; }
    label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 8px; }
    input[type=text], input[type=email], input[type=password], input[type=datetime-local], select {
      width: 100%; height: 48px; padding: 0 16px; font: inherit; color: var(--text-title);
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    button {
      height: 48px; min-width: 44px; padding: 0 24px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
      border: 1px solid var(--line); background: var(--bg); color: var(--text-title);
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    button:focus-visible, .pin:focus-visible, .pick-card:focus-within { outline: 2px solid var(--primary); outline-offset: 2px; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.ghost { border-color: transparent; color: var(--text-body); padding: 0 16px; background: transparent; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .actions.end { justify-content: flex-end; }
    svg.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .flag { width: 20px; height: 15px; object-fit: cover; border-radius: 2px; border: 1px solid var(--line); vertical-align: middle; flex: none; background: var(--bg-sub); }
    .flag.sm { width: 16px; height: 12px; border-radius: 1px; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 8px; background: var(--secondary); color: var(--text-title); font-size: 13px; font-weight: 600; line-height: 24px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; line-height: 24px; color: var(--text-body); background: var(--bg); }
    .chip.ok { border-color: var(--success); color: var(--success); font-weight: 600; }
    .chip.no { border-color: var(--error); color: var(--error); font-weight: 600; }
    .empty { text-align: center; padding: 32px 16px; }
    .empty p { margin: 8px 0 16px; }
    .avatar { display: block; flex: none; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: var(--bg-sub); }
    .avatar svg { display: block; width: 100%; height: 100%; }
    .avatar.lg { width: 64px; height: 64px; }
    .avatar.sm { width: 32px; height: 32px; }

    /* 전체 틀: 왼쪽 세로 메뉴 + 본문 */
    /* 상단 고정 바 */
    #topbar { position: fixed; z-index: 9500; top: 0; left: 0; right: 0; height: var(--top); background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
    .tb-in { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 24px; }
    .brand { height: 44px; padding: 0 8px 0 0; border: 0; background: none; gap: 8px; }
    .brand .mark { width: 32px; height: 32px; }
    .brand .word { font-size: 24px; font-weight: 800; letter-spacing: -0.04em; color: var(--text-title); line-height: 1; }
    .brand .word b { color: var(--primary); font-weight: 800; }
    #topbar .lang select { width: 140px; height: 44px; }
    .shell { display: grid; grid-template-columns: var(--nav) minmax(0, 1fr); min-height: 100vh; padding-top: var(--top); }
    .shell.bare { grid-template-columns: minmax(0, 1fr); }
    #main.auth { padding: 0; }
    #nav { position: sticky; top: var(--top); height: calc(100vh - var(--top)); display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 24px 8px; background: var(--bg); border-right: 1px solid var(--line); }
    .nav-item { height: auto; min-height: 64px; padding: 8px 4px; flex-direction: column; gap: 4px; border: 0; border-radius: 12px; background: transparent; color: var(--text-sub); font-size: 13px; font-weight: 600; text-align: center; line-height: 1.3; }
    .nav-item svg.ic { width: 24px; height: 24px; }
    .nav-item[aria-current=page] { background: var(--bg-sub); color: var(--text-title); }
    .nav-item .avatar { width: 40px; height: 40px; }
    .nav-item.acct { margin-top: auto; }
    .nav-item.guest { color: var(--text-title); }
    .nav-item.guest .ring { width: 40px; height: 40px; border-radius: 50%; border: 2px dashed var(--text-sub); display: flex; align-items: center; justify-content: center; }
    #main { min-width: 0; padding: 32px 32px 64px; }
    .inner { max-width: 1200px; margin: 0 auto; }
    .top { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px 24px; margin-bottom: 32px; }
    .top .lead { margin-top: 8px; }
    .lang { display: flex; align-items: center; gap: 8px; }
    .lang select { width: 160px; }
    .lang .viewtz { margin-right: 8px; }
    @media (max-width: 899px) {
      .shell { grid-template-columns: minmax(0, 1fr); }
      #nav { position: fixed; z-index: 9000; left: 0; right: 0; bottom: 0; top: auto; height: auto; flex-direction: row; padding: 4px 8px; border-right: 0; border-top: 1px solid var(--line); }
      .nav-item { flex: 1; min-height: 56px; }
      .nav-item.acct { margin-top: 0; }
      .nav-item .avatar, .nav-item.guest .ring { width: 28px; height: 28px; }
      #main { padding: 24px 20px 112px; }
      h1 { font-size: 24px; }
      .card { padding: 16px; }
      #topbar .lang select { width: 120px; }
      .lang .viewtz { display: none; }
      .tb-in { padding: 0 16px; }
    }

    /* 진행 단계 */
    .steps { list-style: none; margin: 0 0 24px; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; counter-reset: s; }
    .steps li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 3px solid var(--line); font-size: 13px; color: var(--text-sub); min-width: 0; }
    .steps li .num { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; }
    .steps li.done { border-top-color: var(--text-title); color: var(--text-body); }
    .steps li.done .num { background: var(--text-title); border-color: var(--text-title); color: #fff; }
    .steps li.done .num svg { width: 14px; height: 14px; stroke-width: 3; }
    .steps li.cur { border-top-color: var(--text-title); color: var(--text-title); font-weight: 600; }
    .steps li.cur .num { border: 2px solid var(--text-title); }
    @media (max-width: 599px) { .steps li .lbl { display: none; } .steps li.cur .lbl { display: inline; } }

    /* 1단계: 대상 고르기 */
    .people-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); margin: 24px 0; }
    .pick-card { position: relative; display: flex; gap: 16px; align-items: flex-start; padding: 16px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; margin: 0; color: var(--text-body); font-size: 13px; }
    .pick-card input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .pick-card strong { display: block; font-size: 16px; color: var(--text-title); }
    .line { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .pick-card .tick { position: absolute; top: 16px; right: 16px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; color: transparent; }
    .pick-card .tick svg { width: 14px; height: 14px; stroke-width: 3; }
    .pick-card.on { border: 2px solid var(--primary); padding: 15px; }
    .pick-card.on .tick { background: var(--primary); border-color: var(--primary); color: #fff; top: 15px; right: 15px; }
    .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-top: 24px; }

    /* 2단계: 통합 캘린더 + 답장 */
    .two { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 1100px) { .two { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; } }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; color: var(--text-body); }
    .legend > span { display: inline-flex; align-items: center; gap: 8px; }
    .sw { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); flex: none; }
    .sw.all { background: rgba(46,125,50,.14); border-color: var(--success); }
    .month { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .month strong { font-size: 20px; color: var(--text-title); }
    .month button { width: 44px; padding: 0; border-color: transparent; }
    .grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .dow { text-align: center; font-size: 13px; color: var(--text-sub); padding: 8px 0; }
    .cell {
      position: relative; min-height: 88px; height: auto; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text-title);
      font-weight: 400; min-width: 0; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 4px;
    }
    .cell .n { font-size: 16px; font-weight: 600; line-height: 1.2; }
    .cell .fl { display: flex; flex-wrap: wrap; gap: 4px; }
    .cell .fl .flag { width: 20px; height: 15px; }
    .cell .cnt { position: absolute; right: 8px; bottom: 4px; font-size: 13px; color: var(--text-sub); font-weight: 600; }
    .cell.weekend .n, .cell.past .n { color: var(--text-sub); font-weight: 400; }
    .cell.past { background: var(--bg-sub); }
    .cell:disabled { opacity: 1; cursor: not-allowed; }
    .cell.mine { border: 2px solid var(--primary); padding: 7px; }
    .cell.all { background: rgba(46,125,50,.14); border-color: var(--success); }
    .cell.all .cnt { color: var(--success); }
    .cell:hover:not(:disabled) { border-color: var(--text-sub); }
    .fh { position: relative; display: inline-block; line-height: 0; border-radius: 2px; overflow: hidden; }
    .fh::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(17,17,17,.55) 0 1.5px, transparent 1.5px 4px); }
    .fh img { filter: grayscale(.5); }
    @media (max-width: 599px) { .cell { min-height: 64px; padding: 4px; } .cell.mine { padding: 3px; } .cell .cnt { right: 4px; } .grid7 { gap: 2px; } }

    .live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-body); }
    .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 1.6s ease-out infinite; }
    .live.off .dot { background: var(--text-sub); animation: none; }
    .live button { height: 44px; padding: 0 16px; }
    #feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; align-content: start; }
    @media (min-width: 1100px) { #feed { max-height: 760px; overflow-y: auto; padding-right: 8px; } }
    .msg { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: var(--bg); }
    .msg .who { display: flex; align-items: center; gap: 16px; }
    .msg .who .meta { min-width: 0; flex: 1; line-height: 1.3; }
    .msg .who strong { display: block; color: var(--text-title); }
    .msg .who .when { align-self: flex-start; white-space: nowrap; }
    .msg .body { margin: 16px 0; padding: 8px 16px; border-radius: 8px; background: var(--bg-sub); color: var(--text-title); overflow-wrap: anywhere; }
    .extract { border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; font-size: 13px; }
    .extract .t { margin: 0 0 8px; font-weight: 600; color: var(--text-sub); }
    .extract .r { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    .extract .conv { display: flex; align-items: flex-start; gap: 8px; margin: 8px 0; padding: 8px; border-radius: 8px; background: var(--bg-sub); color: var(--text-title); font-weight: 600; }
    .extract .r svg, .extract .conv svg { width: 16px; height: 16px; }
    .warn { color: var(--error); font-weight: 600; }
    .msg .reply { margin-top: 16px; }
    .msg .reply button[aria-pressed=true] { border-color: var(--success); color: var(--success); }
    .msg.sys { border: 0; padding: 0; background: none; text-align: center; font-size: 13px; color: var(--text-sub); }
    .msg.typing { display: flex; align-items: center; gap: 16px; }
    .dots { display: inline-flex; gap: 4px; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-sub); animation: bounce 1s infinite; }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }

    /* 3단계: AI 추천 */
    .analyze { display: grid; gap: 16px; max-width: 520px; margin: 0 auto; padding: 32px 0; text-align: center; }
    .analyze ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; text-align: left; }
    .analyze li { display: flex; align-items: center; gap: 8px; color: var(--text-sub); }
    .analyze li.done { color: var(--text-title); }
    .analyze li.done svg { color: var(--success); }
    .bar { height: 8px; border-radius: 8px; background: var(--bg-sub); overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--text-title); transition: width .45s var(--ease); }
    .recs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .rec { border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; animation: enter .5s var(--ease) both; }
    .rec.top { border: 2px solid var(--text-title); padding: 23px; }
    .rec .when { font-size: 24px; font-weight: 700; color: var(--text-title); line-height: 1.3; }
    .rec .rows { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .rec .row { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; background: var(--bg-sub); font-size: 13px; color: var(--text-title); min-width: 0; }
    .rec .row .st { margin-left: auto; white-space: nowrap; }
    .rec .row .st.ok { color: var(--success); font-weight: 600; }
    .rec .row .st.no { color: var(--error); font-weight: 600; }
    .rec .row .st.none { color: var(--text-sub); }
    .done-card { text-align: center; display: grid; gap: 16px; justify-items: center; padding: 48px 24px; }
    .done-card .big { width: 64px; height: 64px; border-radius: 50%; background: var(--success); color: #fff; display: flex; align-items: center; justify-content: center; animation: pop .6s var(--ease); }
    .done-card .big svg { width: 32px; height: 32px; stroke-width: 3; }
    .done-card .rows { display: grid; gap: 8px; width: 100%; max-width: 520px; text-align: left; }

    /* 세계지도 */
    .map { position: relative; width: 100%; aspect-ratio: 1000 / 442; min-height: 220px; background: var(--bg-sub); border-radius: 12px; overflow: hidden; }
    .map > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .map path.land { fill: var(--line); }
    .pin { position: absolute; width: var(--pin); height: var(--pin); margin: calc(var(--pin) / -2) 0 0 calc(var(--pin) / -2); border-radius: 50%; cursor: pointer; }
    .pin .avatar { width: 100%; height: 100%; border: 3px solid var(--bg); box-shadow: 0 2px 8px rgba(0,0,0,.16); }
    .pin .fl { position: absolute; right: -8px; bottom: 0; line-height: 0; }
    .pin .lab { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); text-align: center; white-space: nowrap; line-height: 1.3; font-size: 13px; color: var(--text-title); font-weight: 600; }
    .pin .lab span { display: block; font-weight: 400; color: var(--text-body); }
    .pin .st { position: absolute; left: 50%; top: -32px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .pin .st.ok { background: var(--success); color: #fff; animation: pop .5s var(--ease); }
    .pin .st.ok svg { width: 14px; height: 14px; stroke-width: 3; }
    .pin .st.wait { background: var(--bg); border: 2px solid var(--text-title); }
    .pin.done .avatar { border-color: var(--success); }
    .pin.wait .avatar { animation: pulse 1.6s ease-out infinite; }
    .pin.wait .lab span { color: var(--error); font-weight: 600; }

    /* 동료 정보 */
    .team { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .mate { display: grid; gap: 16px; align-content: start; }
    .mate .head { display: flex; gap: 16px; align-items: center; }
    .mate .head strong { display: block; color: var(--text-title); font-size: 20px; line-height: 1.3; }
    .mate dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; font-size: 13px; }
    .mate dt { color: var(--text-sub); }
    .mate dd { margin: 0; color: var(--text-title); }
    .mate .clock { font-size: 24px; font-weight: 700; color: var(--text-title); line-height: 1.2; }
    .strip { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; }
    .strip i { height: 12px; border-radius: 2px; background: var(--bg-sub); }
    .strip i.both { background: var(--success); }

    /* 지난 회의 */
    .assume { display: grid; gap: 16px; }
    @media (min-width: 720px) { .assume .row { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: end; } }
    .band-wrap { overflow-x: auto; padding-bottom: 8px; }
    .band { position: relative; min-width: 640px; height: 200px; }
    .band .track { position: absolute; left: 0; right: 0; top: 96px; height: 16px; border-radius: 8px; background: var(--bg-sub); }
    .band .seg { position: absolute; top: 96px; height: 16px; background: var(--line); }
    .band .seg.alt { background: #D4D9E1; }
    .band .seg.since { background: var(--secondary); }
    .band .gap { position: absolute; top: 64px; transform: translateX(-50%); font-size: 13px; color: var(--text-body); white-space: nowrap; }
    .band .gap.since { font-weight: 700; color: var(--text-title); }
    .band .mk { position: absolute; top: 80px; width: 48px; height: 48px; margin-left: -24px; padding: 0; border-radius: 50%; border: 3px solid var(--bg); background: var(--text-title); color: #fff; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.16); }
    .band .mk.up { background: var(--bg); color: var(--text-title); border: 2px dashed var(--text-title); }
    .band .mk[aria-pressed=true] { outline: 3px solid var(--primary); outline-offset: 2px; }
    .band .mk-lab { position: absolute; top: 136px; transform: translateX(-50%); font-size: 13px; color: var(--text-body); white-space: nowrap; text-align: center; line-height: 1.3; }
    .band .now { position: absolute; top: 24px; bottom: 40px; width: 2px; margin-left: -1px; background: var(--text-title); }
    .band .now span { position: absolute; top: -8px; left: 8px; white-space: nowrap; font-size: 13px; font-weight: 700; color: var(--text-title); }
    .band .tick { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 13px; color: var(--text-sub); white-space: nowrap; }
    .members { display: flex; flex-wrap: wrap; gap: 8px; }
    .members .chip { padding: 4px 8px 4px 4px; }
    .members .chip .avatar { width: 24px; height: 24px; }
    .since-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .since-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 16px; border-radius: 12px; border: 1px solid var(--line); }
    .since-list li[aria-current=true] { border: 2px solid var(--primary); padding: 15px; }
    .since-list .faces { display: flex; }
    .since-list .faces .avatar { width: 32px; height: 32px; border: 2px solid var(--bg); margin-left: -8px; }
    .since-list .faces .avatar:first-child { margin-left: 0; }
    .since-list .txt { flex: 1; min-width: 200px; color: var(--text-title); }

    /* 마이페이지 · 로그인 */
    .form-grid { display: grid; gap: 16px; }

<body>
  <header id="topbar"></header>
  <div class="shell">
    <nav id="nav" aria-label="메뉴"></nav>
    <main id="main"></main>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="tip" role="tooltip"></div>

  <script src="config.js"></script>
  <script>
    // '가정의 시간' (지난 회의 화면에서 바꿀 수 있어요). null 이면 실제 지금
    let ASSUMED = null;
    const nowTs = () => (ASSUMED != null ? ASSUMED : Date.now());

    // ───────── 공휴일 API (KOTRA 공휴일 정보를 브라우저에서 직접 호출, 키는 config.js) ─────────
    // 반환: { supported: boolean, days: { 'YYYY-MM-DD': '공휴일 이름' }, years: [데이터가 있는 연도] }
    const KOTRA_URL = 'https://apis.data.go.kr/B410001/holiday/getHoliday';
    // KOTRA 데이터에는 다른 나라 목록에 한국 공휴일이 섞여 있어서(예: 미국에 광복절) 한국 전용 이름은 한국 외에서 뺀다
    const KR_ONLY = new Set(['3·1절', '광복절', '개천절', '한글날', '현충일', '어린이날']);
    const holidayCache = new Map();

    async function fetchHolidays(country) {
      if (holidayCache.has(country)) return holidayCache.get(country);
      if (typeof CONFIG === 'undefined' || !CONFIG.API_KEY) throw new Error('config.js 에 API_KEY 가 없어요');

      const url = KOTRA_URL + '?serviceKey=' + encodeURIComponent(CONFIG.API_KEY) + '&type=json&numOfRows=100&pageNo=1&search1=' + encodeURIComponent(country);
      // 공공데이터포털이 가끔 일시적으로 5xx를 주므로 한 번만 다시 시도한다
      let res = await fetch(url, { signal: AbortSignal.timeout(8000) }).catch(() => null);
      if (!res || res.status >= 500) res = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      const header = json && json.response && json.response.header;
      if (!header || header.resultCode !== '00') throw new Error('공휴일 API 오류: ' + (header && header.resultMsg));

      const raw = json.response.body && json.response.body.itemList && json.response.body.itemList.item;
      const items = Array.isArray(raw) ? raw : raw ? [raw] : [];
      const days = {}, years = new Set();
      for (const it of items) {
        const d = String(it.hldyDeFrom || '');
        const name = String(it.hldyName || '');
        if (d.length !== 8 || (country !== 'KR' && KR_ONLY.has(name.trim()))) continue;
        days[d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6, 8)] = name;
        years.add(+d.slice(0, 4));
      }
      // KOTRA 에 없는 나라(예: 한국)는 키가 필요 없는 Nager.Date 로 보충한다
      if (!items.length) await fillFromNager(country, days, years);

      const result = { supported: Object.keys(days).length > 0, days, years: [...years] };
      holidayCache.set(country, result);
      return result;
    }

    async function fillFromNager(country, days, years) {
      const thisYear = new Date().getFullYear();
      for (const y of [thisYear, thisYear + 1]) {
        try {
          const res = await fetch('https://date.nager.at/api/v3/PublicHolidays/' + y + '/' + country, { signal: AbortSignal.timeout(8000) });
          if (!res.ok || res.status === 204) continue;
          for (const h of await res.json()) days[h.date] = h.localName || h.name;
          years.add(y);
        } catch (e) { /* 보충 실패는 무시: 공휴일 없음으로 처리 */ }
      }
    }

    // ───────── 시간대 계산 (브라우저 내장 Intl 사용) ─────────
    const fmtCache = {};
    function parts(ts, tz) {
      const f = fmtCache[tz] || (fmtCache[tz] = new Intl.DateTimeFormat('en-US', {
        timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
      }));
      const o = {};
      for (const p of f.formatToParts(new Date(ts))) o[p.type] = p.value;
      const y = +o.year, m = +o.month, d = +o.day;
      return { y, m, d, h: +o.hour, min: +o.minute, date: o.year + '-' + o.month + '-' + o.day, weekday: new Date(Date.UTC(y, m - 1, d)).getUTCDay() };
    }
    function zonedToUtc(dateStr, hour, tz) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const wall = Date.UTC(y, m - 1, d, hour);
      let utc = wall;
      for (let i = 0; i < 3; i++) {
        const p = parts(utc, tz);
        utc = wall - (Date.UTC(p.y, p.m - 1, p.d, p.h) - utc);
      }
      return utc;
    }
    const pad = (n) => String(n).padStart(2, '0');
    const clock = (tz, ts) => { const p = parts(ts || Date.now(), tz); return pad(p.h) + ':' + pad(p.min); };
    const weekdayOf = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };

    // 나라 말로 된 예문 (예문 넣기, 예시 대화에 사용)
    const MN = {
      en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
      de: ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'],
      fr: ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'],
      pt: ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'],
      th: ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'],
      ar: ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'],
      hi: ['जनवरी', 'फ़रवरी', 'मार्च', 'अप्रैल', 'मई', 'जून', 'जुलाई', 'अगस्त', 'सितंबर', 'अक्टूबर', 'नवंबर', 'दिसंबर'],
    };
    function sampleText(lang, m, d, h) {
      const h12 = h % 12 === 0 ? 12 : h % 12, pm = h >= 12;
      switch (lang) {
        case 'ko': return m + '월 ' + d + '일 ' + (pm ? '오후' : '오전') + ' ' + h12 + '시에 가능해요';
        case 'ja': return m + '月' + d + '日の' + h + '時なら大丈夫です';

        if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 8);
      }
      tip.style.left = left + 'px'; tip.style.top = top + 'px';
    }
    const hideTip = () => tip.classList.remove('on');
    function hoverable(node, build, side) {
      node.addEventListener('mouseenter', () => showTip(node, build, side));
      node.addEventListener('focus', () => showTip(node, build, side));
      node.addEventListener('mouseleave', hideTip);
      node.addEventListener('blur', hideTip);
    }
    window.addEventListener('scroll', hideTip, { passive: true });

    // ───────── 공휴일 ─────────
    const holidays = {};            // country -> fetchHolidays 결과
    const holidayState = { failed: new Set(), loading: false };
    const holidayName = (country, date) => { const h = holidays[country]; return h && h.days[date]; };
    async function loadHolidays(force) {
      const countries = [...new Set(state.people.map(countryOf))];
      if (force) countries.forEach((c) => holidayCache.delete(c));
      holidayState.loading = true;
      const res = await Promise.allSettled(countries.map(fetchHolidays));
      holidayState.failed = new Set();
      countries.forEach((c, i) => { if (res[i].status === 'fulfilled') holidays[c] = res[i].value; else holidayState.failed.add(c); });
      holidayState.loading = false;
      refresh();
    }

    // ───────── 가능한 시간 ─────────
    // 말한 시간 → 보기 기준 날짜. 시간 없이 날짜만 고른 것은 그 날짜 그대로
    function baseDateOf(w) {
      const p = person(w.pid);
      if (!p) return null;
      return w.hour == null ? w.date : parts(zonedToUtc(w.date, w.hour, placeOf(p).tz), baseTz()).date;
    }
    function wishIndex() {
      const idx = {};
      state.wishes.forEach((w) => { const d = baseDateOf(w); if (d) (idx[d] = idx[d] || []).push(w); });
      return idx;
    }
    function addWish(pid, date, hour, mid) {
      if (state.wishes.some((w) => w.pid === pid && w.date === date && w.hour === hour)) return null;
      const w = { id: state.nextWish++, pid, date, hour, mid: mid || null };
      state.wishes.push(w);
      return w;
    }
    // 그 순간 p가 가능하다고 했는지 (시간을 말했으면 그 순간, 날짜만 골랐으면 그 날 하루)
    function availAt(p, ts) {
      const lp = parts(ts, placeOf(p).tz);
      return state.wishes.some((w) => w.pid === p.id && (w.hour != null ? zonedToUtc(w.date, w.hour, placeOf(p).tz) === ts : w.date === lp.date));
    }
    const responded = (p) => state.wishes.some((w) => w.pid === p.id);
    const pendingPeople = () => state.people.slice(1).filter((p) => !responded(p));

    // ───────── 추천: 모두가 말한 시간 · 시차 · 공휴일 · 활동 시간을 함께 따져요 ─────────
    function judge(p, ts) {
      const lp = parts(ts, placeOf(p).tz);
      const hol = holidayName(countryOf(p), lp.date);
      const weekend = lp.weekday === 0 || lp.weekday === 6;
      const inHours = lp.h >= state.meetStart && lp.h + DURATION / 60 <= state.meetEnd;
      return { p, lp, avail: availAt(p, ts), hol, weekend, inHours, ok: !hol && !weekend && inHours };
    }
    function recommend() {
      const N = state.people.length, cand = new Set(), now = nowTs();
      state.wishes.forEach((w) => {
        const p = person(w.pid);
        if (!p) return;
        const tz = placeOf(p).tz;
        if (w.hour != null) cand.add(zonedToUtc(w.date, w.hour, tz));
        else HOURS.forEach((h) => cand.add(zonedToUtc(w.date, h, tz)));
      });
      const items = [...cand].filter((ts) => ts > now + 3600000).map((ts) => {
        const rows = state.people.map((p) => judge(p, ts));
        const yes = rows.filter((r) => r.avail && r.ok).length;
        const score = rows.reduce((s, r) => s + (r.avail ? (r.ok ? 3 : 0.5) : r.ok ? 0 : -1), 0);
        return { ts, rows, yes, score, all: yes === N, base: parts(ts, baseTz()) };
      }).filter((x) => x.yes > 0);
      items.sort((a, b) => b.yes - a.yes || b.score - a.score || a.ts - b.ts);
      const seen = new Set(), out = [];
      for (const it of items) {
        if (seen.has(it.base.date)) continue;
        seen.add(it.base.date); out.push(it);
        if (out.length === 3) break;
      }
      return out;
    }

    // ───────── 가상 동료의 답장 ─────────
    const MAX_REPLIES = 2;
    const sim = { timer: null, paused: false, typing: null };
    const fresh = { msgs: new Set(), wishes: new Set() };
    function markFresh(mid, wid) {
      if (mid) fresh.msgs.add(mid);
      if (wid) fresh.wishes.add(wid);
      setTimeout(() => { fresh.msgs.delete(mid); fresh.wishes.delete(wid); }, 1800);
    }
    const sys = (key, vars) => { const m = { id: state.nextMsg++, sys: true, key, vars, ts: nowTs() }; state.messages.push(m); markFresh(m.id); };
    const SAY = {
      en: [
        (m, d, h) => "I'm free on " + MN.en[m - 1] + ' ' + d + ' at ' + ap(h) + '.',
        (m, d, h) => MN.en[m - 1] + ' ' + d + ', ' + ap(h) + ' works for me.',
        (m, d, h) => 'Can we do ' + d + ' ' + MN.en[m - 1] + ' at ' + ap(h) + '?',
      ],
      de: [
        (m, d, h) => 'Ich habe am ' + d + '. ' + MN.de[m - 1] + ' um ' + h + ' Uhr Zeit.',
        (m, d, h) => 'Am ' + d + '. ' + MN.de[m - 1] + ' um ' + h + ' Uhr passt es mir gut.',
      ],
      ja: [
        (m, d, h) => m + '月' + d + '日の' + h + '時なら大丈夫です',
        (m, d, h) => m + '月' + d + '日の' + h + '時はどうですか？',
      ],
    };
    const ap = (h) => (h % 12 === 0 ? 12 : h % 12) + (h >= 12 ? 'pm' : 'am');
    const rnd = (n) => Math.floor(Math.random() * n);
    const say = (lang, m, d, h) => (SAY[lang] ? SAY[lang][rnd(SAY[lang].length)](m, d, h) : sampleText(lang, m, d, h));

    // 참석자 대부분이 활동 시간인 순간 몇 개를 골라둔다 → 답장이 그 근처에 몰려서 일정이 겹쳐 보여요
    function makeHotSlots() {
      const me = state.people[0], tz = placeOf(me).tz, today = parts(nowTs(), tz).date, ref = addDays(today, 4);
      const fit = (h) => state.people.filter((p) => { const lh = parts(zonedToUtc(ref, h, tz), placeOf(p).tz).h; return lh >= 8 && lh <= 21; }).length;
      const best = Math.max(...HOURS.map(fit));
      const hs = HOURS.filter((h) => fit(h) === best).sort((a, b) => Math.abs(a - 20) - Math.abs(b - 20));
      const dates = [];
      for (let i = 2; i <= 16 && dates.length < 3; i++) {
        const d = addDays(today, i), ts = zonedToUtc(d, hs[0], tz);
        if (state.people.every((p) => { const w = parts(ts, placeOf(p).tz).weekday; return w !== 0 && w !== 6; })) dates.push(d);
      }
      return dates.map((date, k) => ({ date, hour: hs[k === 2 && hs[1] != null ? 1 : 0] }));
    }
    function pickInstant(p) {
      const pl = placeOf(p), tz = placeOf(state.people[0]).tz;
      if (state.hotSlots.length && Math.random() < 0.7) {
        const s = state.hotSlots[rnd(state.hotSlots.length)], lp = parts(zonedToUtc(s.date, s.hour, tz), pl.tz);
        return { date: lp.date, hour: lp.h };
      }
      for (let i = 0; i < 20; i++) {
        const date = addDays(parts(nowTs(), pl.tz).date, 2 + rnd(10)), w = weekdayOf(date);
        if (w === 0 || w === 6 || holidayName(pl.country, date)) continue;
        return { date, hour: p.hours[0] + rnd(p.hours[1] - p.hours[0]) };
      }
      return { date: addDays(parts(nowTs(), pl.tz).date, 3), hour: 14 };
    }
    function deliver(p) {
      const inst = pickInstant(p), tz = placeOf(p).tz, lang = langOf(p);
      const [, m, d] = inst.date.split('-').map(Number);
      const mid = state.nextMsg++;
      state.messages.push({ id: mid, pid: p.id, tz, lang, text: say(lang, m, d, inst.hour), ts: nowTs(), found: [{ date: inst.date, hour: inst.hour }] });
      const w = addWish(p.id, inst.date, inst.hour, mid);
      markFresh(mid, w && w.id);
      const c = parts(zonedToUtc(inst.date, inst.hour, tz), baseTz());
      toast(t('t_reply', { n: nameOf(p), d: fmtKD(c.date), h: pad(c.h) + ':00' }));
      refresh();
    }
    const repliesOf = (p) => state.messages.filter((m) => m.pid === p.id).length;
    const simLeft = () => state.people.slice(1).filter((p) => p.id !== state.flow.silent && repliesOf(p) < MAX_REPLIES);
    const simDone = () => !simLeft().length;
    function simSchedule(ms) {
      clearTimeout(sim.timer);
      if (sim.paused || !state.user || state.flow.step < 2 || state.flow.step > 3 || simDone()) return;
      sim.timer = setTimeout(simArrive, ms);
    }
    function simArrive() {
      const left = simLeft();
      if (!left.length) return;
      const p = left[rnd(left.length)];
      sim.typing = p; refresh();
      sim.timer = setTimeout(() => {
        sim.typing = null;
        if (!state.user || state.flow.step < 2) return;
        deliver(p);
        if (simDone()) {
          const wait = pendingPeople();
          if (wait.length) toast(t('t_waiting', { n: wait.map(nameOf).join(', ') }));
          else toast(t('t_all_replied'), 'ok');
        }
        simSchedule(3500 + rnd(2500));
      }, 1400 + rnd(800));
    }
    function setPaused(v) {
      sim.paused = v;
      if (v) { clearTimeout(sim.timer); sim.typing = null; } else simSchedule(1000);
      refresh();
    }
    // 답하지 않은 동료에게 재촉하기 → 잠시 뒤 답장이 와요
    function nudge() {
      const p = person(state.flow.silent);
      if (!p) return;
      state.flow.silent = null;
      toast(t('t_nudged', { n: nameOf(p) }));
      clearTimeout(sim.timer);
      setTimeout(() => {
        sim.typing = p; refresh();
        setTimeout(() => { sim.typing = null; deliver(p); simSchedule(3000); }, 1600);
      }, 600);
    }

    // ───────── 회의 흐름 ─────────
    function resetCollected() {
      Object.assign(state, { messages: [], wishes: [], nextWish: 1, nextMsg: 1, hotSlots: [] });
      Object.assign(sim, { typing: null });
      clearTimeout(sim.timer);
    }
    function startReplies() {
      const f = state.flow;
      resetCollected();
      const others = state.people.slice(1);
      // 동료가 2명 이상이면 한 명은 바로 답하지 않아요 → 지도에서 '응답 대기'로 보여요
      f.silent = others.length >= 2 ? others[others.length - 1].id : null;
      f.started = true;
      state.hotSlots = makeHotSlots();
      state.month = parts(nowTs(), baseTz()).date.slice(0, 7);
      sys('sys_started', { n: others.length });
      sim.paused = false;
      simSchedule(1500);
      loadHolidays();
    }
    // 날짜를 누르면 내 가능한 날로 넣거나 빼요
    function toggleMyDate(date) {
      const me = state.people[0];
      const mine = state.wishes.filter((w) => w.pid === me.id && baseDateOf(w) === date);
      if (mine.length) {
        const ids = new Set(mine.map((w) => w.id));
        state.wishes = state.wishes.filter((w) => !ids.has(w.id));
        toast(t('t_unmarked', { d: fmtKD(date) }));
      } else {
        const w = addWish(me.id, date, null, null);
        markFresh(null, w && w.id);
        toast(t('t_marked', { d: fmtKD(date) }));
      }
      refresh();
    }
    // 받은 답장의 시간을 "나도 가능해요"로 넣거나 빼요
    function toggleMine(m, f) {
      const me = state.people[0], lp = parts(zonedToUtc(f.date, f.hour, m.tz), placeOf(me).tz);
      const mine = state.wishes.find((w) => w.pid === me.id && w.date === lp.date && w.hour === lp.h);
      if (mine) {
        state.wishes = state.wishes.filter((w) => w.id !== mine.id);
        toast(t('t_unmine'));
      } else {
        const w = addWish(me.id, lp.date, lp.h, m.id);
        markFresh(null, w && w.id);
        const b = parts(zonedToUtc(lp.date, lp.h, placeOf(me).tz), baseTz());
        state.month = b.date.slice(0, 7);
        toast(t('t_mine', { d: fmtKD(b.date), h: pad(b.h) + ':00' }));
      }
      refresh();
    }
    const isMineAt = (m, f) => {
      const me = state.people[0], lp = parts(zonedToUtc(f.date, f.hour, m.tz), placeOf(me).tz);
      return state.wishes.some((w) => w.pid === me.id && ((w.date === lp.date && w.hour === lp.h) || (w.hour == null && w.date === lp.date)));
    };
    function confirmMeeting(it) {
      const mt = { id: state.nextMeeting++, ts: it.ts, topic: state.flow.topic.trim(), pids: state.people.slice(1).map((p) => p.id), status: 'active' };
      state.meetings.push(mt);
      // 다시 잡은 회의면 예전 일정은 '일정 변경됨'으로 바꿔요
      const old = state.meetings.find((m) => m.id === state.flow.replaces);
      if (old) { old.status = 'moved'; old.movedTo = mt.id; if (!mt.topic) { mt.tk = old.tk; mt.topic = old.topic; } }
      state.lastConfirmed = mt.id;
      state.flow.step = 4;
      clearTimeout(sim.timer); sim.typing = null;
      toast(t('t_confirmed'), 'ok');
      render();
    }

    // ───────── 지난 회의 ─────────
    // 처음 로그인하면 가상의 지난 회의를 만들어요 (실제 지금 기준 며칠 전)
    function seedMeetings() {
      const tz = PLACES[state.user.place].tz, today = parts(Date.now(), tz).date;
      const seed = [
        [-4, 'seed_sprint', [101, 103]],
        [-13, 'seed_roadmap', [101, 102, 104]],
        [-29, 'seed_launch', [102, 105]],
        [-52, 'seed_partner', [103, 104, 106]],
      ];
      state.meetings = seed.map(([off, tk, pids], i) => ({ id: i + 1, ts: zonedToUtc(addDays(today, off), 21, tz), tk, topic: '', pids, status: 'active' }));
      state.nextMeeting = seed.length + 1;
    }
    const topicOf = (mt) => (mt.tk ? t(mt.tk) : mt.topic || t('topic_default'));
    const daysBetween = (a, b) => Math.floor((b - a) / DAY);
    // 동료별 마지막 회의 (가정의 시간 기준으로 이미 지난 것만)
    // 취소하거나 다른 날로 옮긴 회의는 빼고 본다 (예전에 저장된 회의는 status 가 없어서 진행 중으로 봐요)
    const liveMeetings = () => state.meetings.filter((m) => !m.status || m.status === 'active');
    function cancelMeeting(id) {
      const m = state.meetings.find((x) => x.id === id);
      if (!m) return;
      m.status = 'cancelled';
      render();
      toast(t('t_cancelled', { topic: topicOf(m) }), null, { label: t('undo'), fn: () => restoreMeeting(id) });
    }
    function restoreMeeting(id) {
      const m = state.meetings.find((x) => x.id === id);
      if (!m) return;
      m.status = 'active';
      render();
      toast(t('t_restored'), 'ok');
    }
    function lastMet(pid) {
      const now = nowTs();
      return liveMeetings().filter((m) => m.ts <= now && m.pids.includes(pid)).sort((a, b) => b.ts - a.ts)[0] || null;
    }
    function setAssumed(ts) {
      ASSUMED = ts; state.assumed = ts;
      render();
    }

    // ───────── 번역 사전 (한국어 · English · Deutsch · 日本語) ─────────
    const I18N = {
      ko: {

    };
    for (const l of Object.keys(I18N_EXTRA)) Object.assign(I18N[l], I18N_EXTRA[l]);

    // ───────── 화면 틀 ─────────
    const VIEWS = [
      { id: 'home', icon: 'home', key: 'nav_home' },
      { id: 'plan', icon: 'plan', key: 'nav_plan' },
      { id: 'manage', icon: 'manage', key: 'nav_manage' },
      { id: 'team', icon: 'team', key: 'nav_team' },
      { id: 'past', icon: 'past', key: 'nav_past' },
    ];
    function setView(v) { state.view = v; hideTip(); render(); window.scrollTo({ top: 0 }); }

    function renderNav() {
      const nav = $('nav');
      nav.setAttribute('aria-label', t('nav_label'));
      const items = VIEWS.map((v) => {
        const b = el('button', { type: 'button', class: 'nav-item', 'aria-current': state.view === v.id ? 'page' : 'false' }, icon(v.icon), el('span', { text: t(v.key) }));
        b.addEventListener('click', () => setView(v.id));
        return b;
      });
      // 맨 아래: 로그인했으면 내 캐릭터(마이페이지), 아니면 로그인 안내
      const acct = state.user
        ? el('button', { type: 'button', class: 'nav-item acct', 'aria-current': state.view === 'me' ? 'page' : 'false', 'aria-label': t('nav_me') + ' · ' + nameOf(meP()) }, avatar(meP()), el('span', { text: t('nav_me') }))
        : el('button', { type: 'button', class: 'nav-item acct guest', 'aria-current': state.view === 'me' ? 'page' : 'false', title: t('guest_title') }, el('span', { class: 'ring' }, icon('login')), el('span', { text: t('nav_login') }));
      acct.addEventListener('click', () => setView('me'));
      nav.replaceChildren(...items, acct);
    }

    function header(title, lead) {
      return el('div', { class: 'top' }, el('div', {}, el('h1', { text: title }), lead ? el('p', { class: 'lead', text: lead }) : null));
    }

    function render() {
      document.documentElement.lang = state.lang;
      document.title = 'Whenly';
      renderTopbar();
      const bare = !session || !state.user;
      $('nav').hidden = bare;
      document.querySelector('.shell').classList.toggle('bare', bare);
      if (!bare) renderNav();
      const main = $('main');
      main.classList.toggle('auth', !session);
      if (!session) main.replaceChildren(viewLogin());
      else {
        let body;
        if (!state.user) body = viewOnboard();
        else if (state.view === 'team') body = viewTeam();
        else if (state.view === 'past') body = viewPast();
        else if (state.view === 'me') body = viewMe();
        else if (state.view === 'manage') body = viewManage();
        else if (state.view === 'plan') body = viewPlan();
        else body = viewHome();
        main.replaceChildren(el('div', { class: 'inner' }, ...body));
      }
      if (main._after) { main._after(); main._after = null; }
      save();
    }
    // 답장이 올 때마다 다시 그리지만, 글자를 입력하는 화면(1단계·마이페이지)은 건드리지 않아요
    function refresh() {
      if (!state.user) return save();
      if (state.view === 'plan' && state.flow.step >= 2) render();
      else { renderNav(); save(); }
    }

    // ───────── 상단 고정 바: Whenly 로고 + 언어 ─────────
    function logo() {
      const b = el('button', { type: 'button', class: 'brand', 'aria-label': 'Whenly' + (session && state.user ? ' · ' + t('nav_home') : '') });
      b.innerHTML = '<svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#2D5BFF"/>' +
        '<circle cx="15" cy="17" r="8" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M15 12.5V17l3 2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<circle cx="25" cy="7.5" r="3.5" fill="#FFB800"/></svg><span class="word">when<b>ly</b></span>';
      b.addEventListener('click', () => { if (session && state.user) setView('home'); });
      return b;
    }
    function langSelect() {
      const sel = el('select', { id: 'lang', 'aria-label': t('lang_label') });
      LANG_KEYS.forEach((k) => sel.append(el('option', { value: k, text: LANGS[k].label })));
      sel.value = state.lang;
      sel.addEventListener('change', () => {
        state.lang = sel.value;
        state.viewPlace = LANGS[state.lang].home;
        hideTip(); render();
        if (state.user) toast(t('t_lang', { c: cname(basePlace().country), city: cityName(basePlace()) }));
      });
      return el('div', { class: 'lang' },
        state.user ? el('span', { class: 'caption viewtz', text: t('view_basis', { city: cityName(basePlace()), tz: tzLabel(baseTz()) }) }) : null,
        icon('globe'), sel);
    }
    function renderTopbar() {
      $('topbar').replaceChildren(el('div', { class: 'tb-in' }, logo(), langSelect()));
    }

    // ───────── 로그인 · 회원가입 ─────────
    const auth = { tab: 'login', email: '', err: {}, busy: false, show: false };
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    function hero() {
      const now = nowTs();
      const clocks = [0, 10, 8, 1].map((i) => PLACES[i]).map((pl) => {
        const lp = parts(now, pl.tz);
        return el('span', { class: 'clock-chip' }, flag(pl.country, true), cityName(pl) + ' ' + pad(lp.h) + ':' + pad(lp.min));
      });
      // 각국 말로 온 답장이 내 시간으로 정리되는 모습 (꾸밈용)
      const bubble = (look, color, text, lang, cls) => el('div', { class: 'bubble ' + (cls || '') }, look != null ? avatarOf(look, color, 'sm') : icon('spark'), el('span', { lang, text }));
      return el('div', { class: 'hero' },
        el('div', { class: 'bubbles', 'aria-hidden': 'true' },
          bubble(1, '#2E7D32', "I'm free on Oct 23 at 8am.", 'en', 'b1'),
          bubble(2, '#FFB800', 'Am 23. Oktober um 14 Uhr passt es mir.', 'de', 'b2'),
          bubble(3, '#888888', '10月23日の21時なら大丈夫です', 'ja', 'b3'),
          bubble(null, null, t('hero_conv'), state.lang, 'b4 conv')),
        el('p', { class: 'kicker', text: 'THE WHEN OF EVERYWHERE' }),
        el('div', { class: 'hero-word', 'aria-hidden': 'true' }, 'when', el('b', { text: 'ly' })),
        el('h1', { class: 'hero-sub', text: t('hero_sub') }),
        el('div', { class: 'clocks', 'aria-label': t('hero_clocks') }, ...clocks));
    }
    function focusFirstError() { const x = document.querySelector('[aria-invalid=true]'); if (x) x.focus(); }
    function viewLogin() {
      const signup = auth.tab === 'signup';
      const err = (k) => (auth.err[k] ? el('p', { class: 'err', id: 'err-' + k, text: t(auth.err[k]) }) : null);
      const input = (id, type, ac, val) => {
        const i = el('input', { type, id, autocomplete: ac, value: val || '' });
        if (auth.err[id]) { i.setAttribute('aria-invalid', 'true'); i.setAttribute('aria-describedby', 'err-' + id); }
        return i;
      };
      const email = input('email', 'email', 'email', auth.email);
      email.setAttribute('placeholder', 'name@company.com');
      email.addEventListener('input', () => { auth.email = email.value; });
      const pw = input('pw', auth.show ? 'text' : 'password', signup ? 'new-password' : 'current-password');
      const eye = el('button', { type: 'button', class: 'eye', 'aria-label': auth.show ? t('hide_pw') : t('show_pw'), 'aria-pressed': auth.show ? 'true' : 'false' }, icon(auth.show ? 'eyeoff' : 'eye'));
      eye.addEventListener('click', () => {
        auth.show = !auth.show;
        pw.type = auth.show ? 'text' : 'password';
        eye.replaceChildren(icon(auth.show ? 'eyeoff' : 'eye'));
        eye.setAttribute('aria-label', auth.show ? t('hide_pw') : t('show_pw'));
        eye.setAttribute('aria-pressed', auth.show ? 'true' : 'false');
      });
      const pw2 = signup ? input('pw2', 'password', 'new-password') : null;
      const terms = signup ? el('input', { type: 'checkbox', id: 'terms' }) : null;
      if (terms && auth.err.terms) { terms.setAttribute('aria-invalid', 'true'); terms.setAttribute('aria-describedby', 'err-terms'); }
      const submit = el('button', { type: 'submit', class: 'primary', text: auth.busy ? t('checking') : signup ? t('btn_signup') : t('btn_login') });
      submit.disabled = auth.busy;
      const tab = (k, key) => {
        const b = el('button', { type: 'button', role: 'tab', 'aria-selected': auth.tab === k ? 'true' : 'false', text: t(key) });
        b.addEventListener('click', () => { auth.tab = k; auth.err = {}; render(); });
        return b;
      };
      const swap = el('button', { type: 'button', class: 'link', text: signup ? t('go_login') : t('go_signup') });
      swap.addEventListener('click', () => { auth.tab = signup ? 'login' : 'signup'; auth.err = {}; render(); });
      const demo = el('button', { type: 'button', class: 'ghost', text: t('demo_btn') });
      demo.addEventListener('click', async () => { await demoLogin(); toast(t('t_welcome', { n: nameOf(meP()) }), 'ok'); render(); });

    function feed() {
      const rows = [], me = state.people[0];
      if (sim.typing) rows.push(el('li', { class: 'msg typing enter' }, avatar(sim.typing),
        el('div', { style: 'flex:1' }, el('strong', { style: 'color:var(--text-title)', text: nameOf(sim.typing) }), el('div', { class: 'caption', text: t('typing') })),

      state.messages.slice().reverse().forEach((m) => {
        const cls = 'msg' + (fresh.msgs.has(m.id) ? ' enter' : '');
        if (m.sys) { rows.push(el('li', { class: cls + ' sys', text: t(m.key, m.vars) })); return; }
        const p = person(m.pid);
        if (!p) return;
        const at = parts(m.ts, baseTz());
        const ex = el('div', { class: 'extract' }, el('p', { class: 't', text: t('extracted') }));

          const hol = holidayName(countryOf(p), f.date);
          ex.append(el('div', { class: 'r' }, icon('cal'), el('span', { text: t('local') + ' ' + fmtKD(f.date) + ' ' + hhRange(f.hour) + ' (' + tzLabel(m.tz, ts) + ')' }), hol ? el('span', { class: 'warn', text: t('holiday') }) : null));
          ex.append(el('div', { class: 'conv' }, icon('right'), el('span', { text: viewTime() + ' ' + fmtKD(b.date) + ' ' + hhRange(b.h) + ' (' + tzAbbr(baseTz(), ts) + ')' })));

    function layoutPins(box) {
      const W = box.clientWidth, H = box.clientHeight, list = (box._pins || []).map((x) => ({ ...x, x: x.xy[0] * W, y: x.xy[1] * H, dx: 0 }));
      if (!list.length || !W) return;
      const size = list[0].root.offsetWidth, min = size + 24;
      for (let k = 0; k < 12; k++) for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j], ax = a.x + a.dx, bx = b.x + b.dx, dist = Math.hypot(ax - bx, a.y - b.y);
        if (dist < min) { const push = (min - dist) / 2 + 1, dir = ax <= bx ? -1 : 1; a.dx += dir * push; b.dx -= dir * push; }
      }
      list.forEach(({ root, x, y, dx }) => {
        root.style.left = Math.round(Math.min(Math.max(x + dx, size / 2 + 8), W - size / 2 - 8)) + 'px';

      const R = Math.PI / 180, l = lon * R, p = lat * R, p2 = p * p, p4 = p2 * p2;
      const x = l * (0.8707 - 0.131979 * p2 + p4 * (-0.013791 + p4 * (0.003971 * p2 - 0.001529 * p4)));

      if (!f || f.hour == null) return m.text;
      const [y, mo, d] = f.date.split('-').map(Number);
      const tm = new Intl.DateTimeFormat(LOC(), { hour: 'numeric', timeZone: 'UTC' }).format(new Date(Date.UTC(y, mo - 1, d, f.hour)));
      return t('tr_avail', { d: fmtD(f.date, { month: 'long', day: 'numeric' }), t: tm });
    }
    // 언어 이름도 지금 화면 언어로 (예: 독일어, German, ドイツ語)
    const lnCache = {};
    function langName(code) {
      try {
        const dn = lnCache[state.lang] || (lnCache[state.lang] = new Intl.DisplayNames([LOC()], { type: 'language' }));
        return dn.of(code) || SPOKEN[code];
      } catch (e) { return SPOKEN[code]; }
    }
    function msgBody(m) {
      if (m.lang === state.lang) return [el('div', { class: 'body', lang: m.lang, text: m.text })];
      const orig = showOrig.has(m.id);
      const b = el('button', { type: 'button', class: 'ghost', 'aria-pressed': orig ? 'true' : 'false', text: orig ? t('show_trans') : t('show_orig') });
      b.addEventListener('click', () => { if (orig) showOrig.delete(m.id); else showOrig.add(m.id); render(); });
      return [el('div', { class: 'body', lang: orig ? m.lang : state.lang, text: orig ? m.text : translateMsg(m) }),
        el('div', { class: 'tr' }, icon('globe'), el('span', { text: orig ? t('original_in', { l: langName(m.lang) }) : t('translated_from', { l: langName(m.lang) }) }), b)];
    }

    // ───────── 회의 관리 ─────────
    let manageTab = 'up';
    const relDays = (ts, now) => {
      const d = Math.floor(Math.abs(ts - now) / DAY);
      if (d === 0) return t('within_day');
      return ts > now ? t('in_days', { d: t('days', { n: d }) }) : t('ago', { d: t('days', { n: d }) });
    };
    function reschedule(m, replace) {
      state.flow = newFlow(m.pids.slice());
      state.flow.topic = topicOf(m);
      state.flow.replaces = replace ? m.id : null;
      rebuildPeople(); resetCollected();
      setView('plan');
    }
    function meetingCard(m, kind, now) {
      const b = parts(m.ts, baseTz());
      const ppl = [meP(), ...m.pids.map(person)].filter(Boolean);
      const badge = m.status === 'cancelled' ? el('span', { class: 'chip no', text: t('cancelled_badge') })
        : m.status === 'moved' ? el('span', { class: 'chip', text: t('moved_badge') }) : el('span', { class: 'chip', text: relDays(m.ts, now) });
      const rows = ppl.map((p) => {
        const lp = parts(m.ts, placeOf(p).tz);
        return el('div', { class: 'row' }, flag(countryOf(p), true), el('span', { text: nameOf(p) }), el('span', { class: 'st', text: fmtShort(lp.date) + ' ' + hhRange(lp.h) }));
      });
      const acts = el('div', { class: 'actions end' });
      if (kind === 'up') {
        const re = el('button', { type: 'button', text: t('m_resched') });
        re.addEventListener('click', () => reschedule(m, true));
        const cancel = el('button', { type: 'button', class: 'danger', text: t('m_cancel') });
        cancel.addEventListener('click', () => cancelMeeting(m.id));
        acts.append(cancel, re);
      } else if (kind === 'past') {
        const again = el('button', { type: 'button', text: t('m_again') });
        again.addEventListener('click', () => reschedule(m, false));
        acts.append(again);
      } else if (m.status === 'cancelled') {
        const back = el('button', { type: 'button', text: t('m_restore') });
        back.addEventListener('click', () => restoreMeeting(m.id));
        acts.append(back);
      }
      return el('article', { class: 'card mcard' + (kind === 'off' ? ' off' : '') },
        el('div', { class: 'card-head', style: 'margin:0' }, el('h3', { text: topicOf(m) }), badge),
        el('div', {}, el('div', { class: 'when', text: fmtKD(b.date) + ' ' + hhRange(b.h) }), el('span', { class: 'caption', text: viewTime() + ' · ' + t('participants_n', { n: ppl.length }) })),
        el('div', { class: 'rows' }, ...rows),
        acts.children.length ? acts : null);
    }
    function viewManage() {
      const now = nowTs(), live = liveMeetings();
      const lists = {
        up: live.filter((m) => m.ts > now).sort((a, b) => a.ts - b.ts),
        past: live.filter((m) => m.ts <= now).sort((a, b) => b.ts - a.ts),
        off: state.meetings.filter((m) => m.status === 'cancelled' || m.status === 'moved').sort((a, b) => b.ts - a.ts),
      };
      const tabs = el('div', { class: 'tabs', role: 'tablist', 'aria-label': t('nav_manage') }, ...[['up', 'tab_up'], ['past', 'tab_past'], ['off', 'tab_cancel']].map(([k, key]) => {
        const b = el('button', { type: 'button', role: 'tab', 'aria-selected': manageTab === k ? 'true' : 'false', text: t(key) + ' ' + lists[k].length });
        b.addEventListener('click', () => { manageTab = k; render(); });
        return b;
      }));
      const items = lists[manageTab];
      let body;
      if (items.length) body = el('div', { class: 'mlist', role: 'tabpanel' }, ...items.map((m) => meetingCard(m, manageTab, now)));
      else {
        const go = manageTab === 'up' ? el('button', { type: 'button', class: 'primary' }, icon('plus'), t('new_meeting'))
          : manageTab === 'past' ? el('button', { type: 'button', text: t('nav_past') }) : el('button', { type: 'button', text: t('tab_up') });
        go.addEventListener('click', () => {
          if (manageTab === 'up') { state.flow = newFlow(); rebuildPeople(); resetCollected(); setView('plan'); }
          else if (manageTab === 'past') setView('past');
          else { manageTab = 'up'; render(); }
        });
        body = el('section', { class: 'card empty', role: 'tabpanel' }, el('strong', { text: t('empty_' + manageTab) }), el('p', { text: t('empty_' + manageTab + '_body') }), go);
      }
      return [header(t('manage_title'), t('manage_lead')), tabs, body];
    }

    // ───────── 각국 동료들 정보 ─────────
    function viewTeam() {
      const me = meP(), myTz = placeOf(me).tz, now = nowTs();
      const cards = TEAM.map((p) => {
        const tz = placeOf(p).tz, lp = parts(now, tz);
        const diff = (offsetMin(tz, now) - offsetMin(myTz, now)) / 60;
        const diffTxt = diff === 0 ? t('diff_same') : diff > 0 ? t('diff_ahead', { h: Math.abs(diff) }) : t('diff_behind', { h: Math.abs(diff) });
        // 서로 근무 시간이 겹치는 시간 (내 시간 0~23시 기준)
        const strip = el('div', { class: 'strip', 'aria-hidden': 'true' });
        let both = 0;
        HOURS.forEach((h) => {
          const ts = zonedToUtc(parts(now, myTz).date, h, myTz), th = parts(ts, tz).h;
          const ok = h >= state.meetStart && h < state.meetEnd && th >= p.hours[0] && th < p.hours[1];
          if (ok) both++;
          strip.append(el('i', { class: ok ? 'both' : '' }));
        });
        const lm = lastMet(p.id);
        const plan = el('button', { type: 'button', text: t('plan_with', { n: nameOf(p) }) });
        plan.addEventListener('click', () => { state.flow = newFlow([p.id]); rebuildPeople(); resetCollected(); setView('plan'); });
        return el('article', { class: 'card mate' },
          el('div', { class: 'head' }, avatar(p, 'lg'), el('div', {}, el('strong', { text: nameOf(p) }), el('div', { class: 'caption', text: t(p.role) }), mateLine(p))),
          el('div', {}, el('div', { class: 'clock', text: pad(lp.h) + ':' + pad(lp.min) }), el('span', { class: 'caption', text: fmtKD(lp.date) + ' · ' + tzLabel(tz) })),
          el('dl', {},
            el('dt', { text: t('time_diff') }), el('dd', { text: diffTxt }),
            el('dt', { text: t('language') }), el('dd', { text: SPOKEN[langOf(p)] }),
            el('dt', { text: t('work_hours') }), el('dd', { text: t('local_range', { a: pad(p.hours[0]), b: pad(p.hours[1]) }) }),
            el('dt', { text: t('last_meet') }), el('dd', { text: lm ? t('ago_topic', { d: t('days', { n: daysBetween(lm.ts, now) }), topic: topicOf(lm) }) : t('never') })),
          el('div', {}, el('div', { class: 'caption', style: 'margin-bottom:8px', text: t('overlap', { n: both, me: nameOf(me) }) }), strip),
          plan);
      });
      return [header(t('team_title'), t('team_lead')), el('div', { class: 'team' }, ...cards)];
    }

    // ───────── 지난 회의 ─────────
    function toLocalInput(ts) { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
    function namesOf(mt) { return mt.pids.map(person).filter(Boolean).map(nameOf).join(', '); }
    function viewPast() {
      const now = nowTs();
      // 가정의 시간
      const input = el('input', { type: 'datetime-local', id: 'assume', value: toLocalInput(now) });
      input.addEventListener('change', () => { const v = new Date(input.value).getTime(); if (!isNaN(v)) setAssumed(v); });
      const jump = (k, days) => { const b = el('button', { type: 'button', text: t(k) }); b.addEventListener('click', () => setAssumed(now + days * DAY)); return b; };
      const reset = el('button', { type: 'button', class: 'ghost', text: t('back_now') });
      reset.disabled = ASSUMED == null;
      reset.addEventListener('click', () => setAssumed(null));
      const assume = el('section', { class: 'card assume', 'aria-labelledby': 'as-title' },
        el('div', { class: 'card-head', style: 'margin:0' }, el('h2', { id: 'as-title', text: t('assume_title') }), ASSUMED != null ? el('span', { class: 'badge', text: t('assume_on') }) : null),
        el('p', { class: 'caption', text: t('assume_body') }),
        el('div', { class: 'row' }, el('div', {}, el('label', { for: 'assume', text: t('assume_label') }), input),
          el('div', { class: 'actions' }, jump('plus_day', 1), jump('plus_week', 7), jump('plus_month', 30), reset)));

      const list = liveMeetings().sort((a, b) => a.ts - b.ts);
      if (!list.length) return [header(t('past_title'), t('past_lead')), assume, el('section', { class: 'card empty' }, el('strong', { text: t('past_empty') }), el('p', { text: t('past_empty_body') }))];
      const pastOnes = list.filter((m) => m.ts <= now), last = pastOnes[pastOnes.length - 1];
      if (state.selMeeting == null || !list.some((m) => m.id === state.selMeeting)) state.selMeeting = (last || list[0]).id;

      // 띠: 회의 사이 간격과 마지막 회의부터 지금까지
      const start = list[0].ts - 3 * DAY, end = Math.max(now, list[list.length - 1].ts) + 4 * DAY;
      const pos = (ts) => ((ts - start) / (end - start)) * 100 + '%';
      const band = el('div', { class: 'band', role: 'group', 'aria-label': t('band_label') }, el('div', { class: 'track' }));
      list.forEach((m, i) => {
        const nxt = list[i + 1];
        if (nxt && nxt.ts <= now) {
          band.append(el('div', { class: 'seg' + (i % 2 ? ' alt' : ''), style: 'left:' + pos(m.ts) + ';width:calc(' + pos(nxt.ts) + ' - ' + pos(m.ts) + ')' }));
          band.append(el('div', { class: 'gap', style: 'left:calc((' + pos(m.ts) + ' + ' + pos(nxt.ts) + ') / 2)', text: t('days', { n: daysBetween(m.ts, nxt.ts) }) }));
        }
      });
      if (last) {
        band.append(el('div', { class: 'seg since', style: 'left:' + pos(last.ts) + ';width:calc(' + pos(now) + ' - ' + pos(last.ts) + ')' }));
        band.append(el('div', { class: 'gap since', style: 'left:calc((' + pos(last.ts) + ' + ' + pos(now) + ') / 2)', text: t('days', { n: daysBetween(last.ts, now) }) }));
      }
      band.append(el('div', { class: 'now', style: 'left:' + pos(now) }, el('span', { text: ASSUMED != null ? t('now_assumed') : t('now') })));
      for (let i = 0; i <= 4; i++) {
        const ts = start + (end - start) * (i / 4);
        band.append(el('div', { class: 'tick', style: 'left:' + (i === 0 ? '24px' : i === 4 ? 'calc(100% - 24px)' : pos(ts)), text: fmtShort(parts(ts, baseTz()).date) }));
      }
      list.forEach((m) => {
        const up = m.ts > now;
        const b = el('button', { type: 'button', class: 'mk' + (up ? ' up' : ''), style: 'left:' + pos(m.ts), 'aria-pressed': m.id === state.selMeeting ? 'true' : 'false',
          'aria-label': topicOf(m) + ', ' + fmtKD(parts(m.ts, baseTz()).date) + ', ' + namesOf(m), text: String(m.pids.length + 1) });
        b.addEventListener('click', () => { state.selMeeting = m.id; render(); });
        hoverable(b, () => [el('h4', { text: topicOf(m) }), el('div', { text: fmtKD(parts(m.ts, baseTz()).date) + ' ' + pad(parts(m.ts, baseTz()).h) + ':00' }), el('div', { class: 'sec', text: nameOf(meP()) + ', ' + namesOf(m) })]);
        band.append(b, el('div', { class: 'mk-lab', style: 'left:' + pos(m.ts), text: fmtShort(parts(m.ts, baseTz()).date) + (up ? ' · ' + t('upcoming') : '') }));
      });
      const summary = last
        ? el('p', { style: 'font-size:20px;font-weight:600;color:var(--text-title);margin-bottom:24px', text: daysBetween(last.ts, now) === 0 ? t('since_last_0', { topic: topicOf(last) }) : t('since_last', { d: t('days', { n: daysBetween(last.ts, now) }), topic: topicOf(last) }) })
        : el('p', { style: 'margin-bottom:24px', text: t('no_past_yet') });
      const timeline = el('section', { class: 'card', 'aria-labelledby': 'tl-title' },
        el('div', { class: 'card-head' }, el('h2', { id: 'tl-title', text: t('timeline') }),
          el('div', { class: 'legend' }, el('span', {}, el('span', { class: 'sw', style: 'background:var(--secondary);border-color:var(--secondary)' }), t('lg_since')),
            el('span', {}, el('span', { class: 'sw', style: 'border-radius:50%;background:var(--text-title)' }), t('lg_done')),
            el('span', {}, el('span', { class: 'sw', style: 'border-radius:50%;border:2px dashed var(--text-title)' }), t('lg_up')))),
        summary, el('div', { class: 'band-wrap' }, band));

      // 멤버별 마지막 회의
      const members = el('div', { class: 'members' }, ...TEAM.map((p) => {
        const lm = lastMet(p.id), d = lm ? daysBetween(lm.ts, now) : null;
        return el('span', { class: 'chip' + (d != null && d >= 30 ? ' no' : '') }, avatar(p, 'sm'), nameOf(p) + ' · ' + (d == null ? t('never_short') : t('days', { n: d })) + (d != null && d >= 30 ? ' · ' + t('long_time') : ''));
      }));
      // 회의별: 어떤 멤버들과 며칠 지났는지
      const rows = list.slice().reverse().map((m) => {
        const up = m.ts > now, d = Math.abs(daysBetween(up ? now : m.ts, up ? m.ts : now));
        const txt = up ? t('upcoming_with', { names: namesOf(m), d: t('days', { n: d }), topic: topicOf(m) })
          : d === 0 ? t('today_with', { names: namesOf(m), topic: topicOf(m) })
          : t('since_with', { names: namesOf(m), d: t('days', { n: d }), topic: topicOf(m) });
        const li = el('li', { 'aria-current': m.id === state.selMeeting ? 'true' : 'false' },
          el('span', { class: 'faces' }, ...m.pids.map(person).filter(Boolean).map((p) => avatar(p, 'sm'))),
          el('span', { class: 'txt', text: txt }),
          el('span', { class: 'caption', text: fmtKD(parts(m.ts, baseTz()).date) }), up ? el('span', { class: 'chip', text: t('upcoming') }) : null);
        return li;
      });
      const byMember = el('section', { class: 'card', 'aria-labelledby': 'mm-title' },
        el('h2', { id: 'mm-title', style: 'margin-bottom:16px', text: t('by_member') }), members,
        el('h3', { style: 'margin:24px 0 16px', text: t('by_meeting') }), el('ul', { class: 'since-list' }, ...rows));
      return [header(t('past_title'), t('past_lead')), el('div', { class: 'stack' }, assume, timeline, byMember)];
    }

    // ───────── 마이페이지 ─────────
    function viewMe() {
      const u = state.user;
      const looks = el('div', { class: 'looks-row', role: 'group', 'aria-label': t('my_look') }, ...LOOKS.map((_, i) => {
        const b = el('button', { type: 'button', 'aria-pressed': i === u.look ? 'true' : 'false', 'aria-label': t('look_n', { n: i + 1 }) }, avatarOf(i, MY_COLOR));
        b.addEventListener('click', () => { u.look = i; rebuildPeople(); render(); toast(t('t_saved')); });
        return b;
      }));
      const name = el('input', { type: 'text', id: 'me-name', maxlength: '20', value: u.name });
      name.addEventListener('change', () => { u.name = name.value.trim() || t('default_name'); rebuildPeople(); render(); toast(t('t_saved')); });
      const city = el('select', { id: 'me-city' });
      PLACES.forEach((pl, i) => city.append(el('option', { value: i, text: cname(pl.country) + ' · ' + cityName(pl) })));
      city.value = String(u.place);
      city.addEventListener('change', () => { u.place = +city.value; rebuildPeople(); render(); toast(t('t_saved')); });
      const role = el('select', { id: 'me-role' });
      ROLES.forEach((r) => role.append(el('option', { value: r, text: t(r) })));
      role.value = u.role || 'role_other';
      role.addEventListener('change', () => { u.role = role.value; rebuildPeople(); render(); toast(t('t_saved')); });
      const hourSel = (id, val, from, to, on) => {
        const s = el('select', { id });
        for (let h = from; h <= to; h++) s.append(el('option', { value: h, text: pad(h) + ':00' }));
        s.value = String(val);
        s.addEventListener('change', () => on(+s.value));
        return s;
      };
      const ms = hourSel('meet-start', state.meetStart, 0, 23, (v) => { if (v < state.meetEnd) { state.meetStart = v; toast(t('t_saved')); } render(); });
      const me_ = hourSel('meet-end', state.meetEnd, 1, 24, (v) => { if (v > state.meetStart) { state.meetEnd = v; toast(t('t_saved')); } render(); });
      const out = el('button', { type: 'button', text: t('logout') });
      out.addEventListener('click', () => { logOut(); auth.tab = 'login'; render(); window.scrollTo({ top: 0 }); });
      const wipe = el('button', { type: 'button', class: 'ghost', text: t('wipe') });
      wipe.addEventListener('click', () => { clearTimeout(sim.timer); seedMeetings(); state.flow = newFlow(); rebuildPeople(); resetCollected(); setAssumed(null); toast(t('t_wiped')); });
      return [header(t('me_title'), t('me_lead')), el('div', { class: 'stack' },
        el('section', { class: 'card', 'aria-labelledby': 'pf-title' },
          el('div', { class: 'card-head' }, el('div', { style: 'display:flex;align-items:center;gap:16px' }, avatar(meP(), 'lg'),
            el('div', {}, el('h2', { id: 'pf-title', text: nameOf(meP()) }), el('span', { class: 'caption', text: cname(PLACES[u.place].country) + ' · ' + cityName(PLACES[u.place]) + ' (' + tzLabel(PLACES[u.place].tz) + ')' })))),
          el('div', { class: 'form-grid two-col' },
            el('fieldset', { class: 'looks', style: 'grid-column:1/-1' }, el('legend', { text: t('my_look') }), looks),
            el('div', {}, el('label', { for: 'me-name', text: t('name') }), name),
            el('div', {}, el('label', { for: 'me-city', text: t('my_city') }), city),
            el('div', {}, el('label', { for: 'me-role', text: t('job') }), role),
            el('div', {}, el('label', { text: t('email') }), el('p', { style: 'color:var(--text-title);line-height:48px', text: session || '' })))),
        el('section', { class: 'card', 'aria-labelledby': 'st-title' },
          el('h2', { id: 'st-title', style: 'margin-bottom:8px', text: t('settings') }),
          el('p', { class: 'caption', style: 'margin-bottom:16px', text: t('meet_hours_body') }),
          el('div', { class: 'form-grid two-col' },
            el('div', {}, el('label', { for: 'meet-start', text: t('meet_from') }), ms),
            el('div', {}, el('label', { for: 'meet-end', text: t('meet_to') }), me_)),
          el('p', { class: 'caption', style: 'margin-top:16px', text: t('view_basis', { city: cityName(basePlace()), tz: tzLabel(baseTz()) }) + ' · ' + t('lang_hint') })),
        el('div', { class: 'actions' }, out, wipe))];
    }

    // ───────── 시작 ─────────
    load();
    window.addEventListener('resize', () => { const box = document.querySelector('.map'); if (box) layoutPins(box); });
    // 동료 정보 화면의 현지 시각을 1분마다 새로 고친다
    setInterval(() => { if (state.user && (state.view === 'team' || state.view === 'home')) render(); }, 60000);
    render();
    if (state.user) {
      loadHolidays();
      if (state.flow.started && state.flow.step >= 2 && state.flow.step <= 3) simSchedule(2000);
      if (state.flow.step === 3) startAnalysis();
    }
  </script>
</body>
</html>
